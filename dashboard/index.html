<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부서 건강도 설문 대시보드</title>
<style>
  :root {
    --navy-900: #0f1b33;
    --navy-800: #16233f;
    --navy-700: #1f3157;
    --navy-600: #2c4470;
    --navy-100: #e8ecf6;
    --paper: #f5f6fa;
    --card: #ffffff;
    --coral: #ff6f5e;
    --coral-dark: #e2503f;
    --gold: #d9a441;
    --gold-light: #f4e3bd;
    --positive: #2f9e6e;
    --negative: #e2503f;
    --muted: #8a90a3;
    --border: #e3e6ef;
    --text: #1a2236;
    --radius: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font-size: 14px;
  }
  a { color: inherit; }

  /* ---- Header / mode switch ---- */
  header.app-header {
    background: var(--navy-900);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  header.app-header .title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.2px;
    margin-right: auto;
  }
  header.app-header .title .round-badge {
    display: inline-block;
    margin-left: 10px;
    background: var(--gold);
    color: var(--navy-900);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    vertical-align: middle;
  }
  .mode-switch {
    display: flex;
    background: var(--navy-700);
    border-radius: 999px;
    padding: 3px;
  }
  .mode-switch button {
    border: none;
    background: transparent;
    color: #cfd6e8;
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .mode-switch button.active {
    background: var(--coral);
    color: #fff;
  }
  .file-controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn {
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    background: var(--navy-700);
    color: #fff;
    white-space: nowrap;
  }
  .btn:hover { background: var(--navy-600); }
  .btn.coral { background: var(--coral); }
  .btn.coral:hover { background: var(--coral-dark); }
  .btn.ghost {
    background: transparent;
    border-color: rgba(255,255,255,0.35);
  }
  .btn.ghost:hover { background: rgba(255,255,255,0.1); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  input[type=file] { display: none; }

  main { padding: 20px 24px 60px; max-width: 1280px; margin: 0 auto; }
  [hidden] { display: none !important; }

  /* ---- View mode layout ---- */
  #view-mode { display: flex; gap: 20px; align-items: flex-start; }
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    position: sticky;
    top: 78px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
  }
  .sidebar h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tree ul { list-style: none; margin: 0; padding-left: 14px; }
  .tree > ul { padding-left: 0; }
  .tree li { margin: 1px 0; }
  .tree .node-row {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px 6px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
  }
  .tree .node-row:hover { background: var(--navy-100); }
  .tree .node-row.selected { background: var(--coral); color: #fff; font-weight: 700; }
  .tree .toggle {
    width: 14px; text-align: center; color: var(--muted); font-size: 10px; user-select: none;
  }
  .tree .node-row.selected .toggle { color: #fff; }
  .tree .leaf-dot { color: var(--border); width: 14px; text-align: center; }

  .content { flex: 1; min-width: 0; }

  .breadcrumb {
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
    margin-bottom: 16px; font-size: 13px; color: var(--muted);
  }
  .breadcrumb .crumb { cursor: pointer; padding: 3px 6px; border-radius: 6px; }
  .breadcrumb .crumb:hover { background: var(--navy-100); color: var(--navy-900); }
  .breadcrumb .crumb.current { color: var(--navy-900); font-weight: 700; background: none; cursor: default; }
  .breadcrumb .sep { color: var(--border); }

  .dept-header {
    background: var(--navy-900);
    color: #fff;
    border-radius: var(--radius);
    padding: 20px 22px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .dept-header .name { font-size: 20px; font-weight: 800; }
  .dept-header .code { font-size: 12px; color: #aab3cc; margin-left: 8px; font-weight: 500; }
  .dept-header .level-badge {
    display: inline-block; margin-left: 8px; font-size: 11px; padding: 2px 8px;
    border-radius: 999px; background: var(--navy-700); color: #cfe0ff; vertical-align: middle;
  }
  .dept-header .meta { font-size: 12.5px; color: #cfd6e8; margin-top: 6px; }
  .dept-header .stats { display: flex; gap: 22px; text-align: right; }
  .dept-header .stat .num { font-size: 20px; font-weight: 800; }
  .dept-header .stat .label { font-size: 11px; color: #aab3cc; }
  .response-bar {
    width: 100%; height: 6px; background: rgba(255,255,255,0.15); border-radius: 4px; margin-top: 8px; overflow: hidden;
  }
  .response-bar > div { height: 100%; background: var(--gold); }

  .section-title {
    font-size: 13px; font-weight: 700; color: var(--navy-800); margin: 22px 0 10px;
    text-transform: uppercase; letter-spacing: .04em;
  }

  .area-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .area-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; border-top: 4px solid var(--coral);
  }
  .area-card:nth-child(2) { border-top-color: var(--gold); }
  .area-card:nth-child(3) { border-top-color: var(--navy-600); }
  .area-card .area-name { font-size: 13px; font-weight: 700; color: var(--navy-800); }
  .area-card .area-score { font-size: 32px; font-weight: 800; margin-top: 6px; color: var(--navy-900); }
  .area-card .yoy { font-size: 12.5px; margin-top: 4px; font-weight: 600; }
  .yoy.up { color: var(--positive); }
  .yoy.down { color: var(--negative); }
  .yoy.none { color: var(--muted); font-weight: 500; }

  .item-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .item-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; cursor: pointer; transition: box-shadow .15s;
  }
  .item-card:hover { box-shadow: 0 2px 10px rgba(15,27,51,0.08); border-color: var(--navy-600); }
  .item-card .item-area-tag { font-size: 10.5px; color: var(--muted); }
  .item-card .item-name { font-size: 13.5px; font-weight: 700; margin: 3px 0; }
  .item-card .item-score { font-size: 20px; font-weight: 800; color: var(--navy-900); }
  .item-card .chevron { float: right; color: var(--muted); font-size: 11px; }
  .item-card.expanded { border-color: var(--coral); background: #fff8f7; }

  .question-list {
    grid-column: 1 / -1;
    background: var(--navy-100);
    border-radius: 10px;
    padding: 10px 14px;
    margin-top: -4px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px 16px;
  }
  .question-list .q-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 4px 0; }
  .question-list .q-row .q-label { color: var(--navy-700); }
  .question-list .q-row .q-score { font-weight: 700; color: var(--navy-900); }

  .no-data-note {
    background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius);
    padding: 30px; text-align: center; color: var(--muted); margin-top: 16px;
  }

  /* ---- Admin mode ---- */
  #admin-mode { display: flex; gap: 20px; align-items: flex-start; }
  .admin-panel {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; flex: 1;
  }
  .admin-toolbar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px;
    padding-bottom: 14px; border-bottom: 1px solid var(--border);
  }
  .admin-toolbar label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .admin-toolbar input[type=text] {
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13px; width: 140px;
  }
  .admin-hint { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
  .admin-tree-wrap { display: flex; gap: 16px; }
  .admin-tree { flex: 1; }
  .admin-tree ul { list-style: none; margin: 0; padding-left: 22px; }
  .admin-tree > ul { padding-left: 0; }
  .admin-node {
    display: flex; align-items: center; gap: 8px;
    background: var(--navy-100); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; margin: 4px 0; cursor: grab; font-size: 13px;
  }
  .admin-node.dragging { opacity: 0.4; }
  .admin-node.drop-target { outline: 2px dashed var(--coral); background: #fff1ef; }
  .admin-node .level-chip {
    font-size: 10px; color: #fff; background: var(--navy-600); border-radius: 999px; padding: 1px 7px;
  }
  .admin-node .code { color: var(--muted); font-size: 11px; }
  .root-dropzone {
    border: 2px dashed var(--border); border-radius: var(--radius); padding: 16px;
    text-align: center; color: var(--muted); font-size: 12.5px; margin-bottom: 14px;
  }
  .root-dropzone.drop-target { border-color: var(--coral); color: var(--coral-dark); background: #fff8f7; }

  /* ---- Analysis tabs ---- */
  .tabs {
    display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 16px; flex-wrap: wrap;
  }
  .tab-btn {
    border: none; background: none; padding: 9px 14px; font-size: 13px; font-weight: 600;
    color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px;
  }
  .tab-btn:hover { color: var(--navy-800); }
  .tab-btn.active { color: var(--coral-dark); border-bottom-color: var(--coral); }
  .tab-panel-title { font-size: 15px; font-weight: 800; color: var(--navy-900); margin: 4px 0 4px; }
  .tab-panel-desc { font-size: 12.5px; color: var(--muted); margin-bottom: 16px; line-height: 1.6; }
  .note-box {
    background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius);
    padding: 24px; text-align: center; color: var(--muted); font-size: 13px;
  }
  .note-box.warning { border-color: var(--negative); color: var(--coral-dark); background: #fff8f7; }

  /* confidence badges */
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .badge.trusted { background: #e3f5ec; color: var(--positive); }
  .badge.caution { background: var(--gold-light); color: #8a6a1a; }
  .badge.warning { background: #fde3e0; color: var(--negative); }

  /* generic data table */
  table.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.data-table th, table.data-table td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--border); }
  table.data-table th:first-child, table.data-table td:first-child { text-align: left; }
  table.data-table th:nth-child(2), table.data-table td:nth-child(2) { text-align: left; }
  table.data-table th { color: var(--muted); font-weight: 700; font-size: 11px; text-transform: uppercase; }
  table.data-table tr.selected-row { background: var(--navy-100); }
  table.data-table tr.outlier-row td { color: var(--coral-dark); }

  .chip { display: inline-block; font-size: 10.5px; padding: 2px 7px; border-radius: 999px; background: var(--navy-100); color: var(--navy-800); margin: 2px 3px 2px 0; }
  .chip.risk { background: #fde3e0; color: var(--negative); }

  /* any inline-SVG chart (bar chart, scatter plot, range track), all
     capturable as an image via the "그래프 이미지로 복사" button */
  .chart-block { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  .chart-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .btn-capture-chart { font-size: 11.5px; padding: 5px 10px; background: var(--navy-100); color: var(--navy-800); }
  .btn-capture-chart:hover { background: var(--navy-600); color: #fff; }
  .chart-copy-status { font-size: 11.5px; color: var(--positive); font-weight: 600; }
  .svg-chart-wrap svg { width: 100%; height: auto; display: block; }
  .scatter-caption { font-size: 12px; color: var(--muted); margin-top: 8px; }

  .variance-label { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin-bottom: 14px; }
  .variance-label.even-good { background: #e3f5ec; color: var(--positive); }
  .variance-label.even-bad { background: #fde3e0; color: var(--negative); }
  .variance-label.spread { background: var(--gold-light); color: #8a6a1a; }
  .stat-row { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat-row .stat-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; min-width: 90px; }
  .stat-row .stat-box .v { font-size: 18px; font-weight: 800; color: var(--navy-900); }
  .stat-row .stat-box .l { font-size: 11px; color: var(--muted); }

  .subtoggle { display: flex; gap: 6px; margin-bottom: 14px; }
  .subtoggle button {
    border: 1px solid var(--border); background: var(--card); color: var(--navy-800);
    padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .subtoggle button.active { background: var(--navy-900); color: #fff; border-color: var(--navy-900); }

  /* ---- Report mode (전체 보고: full flat table, copy-to-Excel/Word) ---- */
  .report-panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .report-toolbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
  .report-checkbox { font-size: 12.5px; color: var(--navy-800); display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .report-hint { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
  #report-copy-status { font-size: 12px; color: var(--positive); font-weight: 600; }
  .report-filters { display: flex; gap: 24px; flex-wrap: wrap; background: var(--paper); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; }
  .filter-group { min-width: 220px; }
  .filter-group-title { font-size: 11.5px; font-weight: 700; color: var(--navy-800); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 8px; }
  .filter-group-actions { font-weight: 500; text-transform: none; letter-spacing: 0; margin-left: 8px; }
  .filter-group-actions a { color: var(--coral-dark); text-decoration: none; cursor: pointer; }
  .filter-group-actions a:hover { text-decoration: underline; }
  .filter-group > div:not(.filter-group-title) { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .report-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table.report-table { border-collapse: collapse; font-size: 11.5px; white-space: nowrap; }
  table.report-table th, table.report-table td { padding: 6px 9px; border: 1px solid var(--border); text-align: right; }
  table.report-table th { background: var(--navy-900); color: #fff; position: sticky; top: 0; font-weight: 700; text-align: center; }
  table.report-table td.text-col, table.report-table th.text-col { text-align: left; }
  table.report-table tr:nth-child(even) td { background: var(--paper); }
  table.report-table td.level-cell { color: var(--navy-800); font-weight: 600; background: var(--navy-100) !important; }

  @media (max-width: 900px) {
    #view-mode, #admin-mode, #report-mode { flex-direction: column; }
    .sidebar { width: 100%; position: static; max-height: none; }
    .area-grid { grid-template-columns: 1fr; }
    .item-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="title">부서 건강도 설문 대시보드<span class="round-badge" id="round-badge">-</span></div>
  <div class="mode-switch">
    <button id="btn-mode-view" class="active">조회 모드</button>
    <button id="btn-mode-admin">관리자 모드</button>
    <button id="btn-mode-report">전체 보고</button>
  </div>
  <div class="file-controls">
    <button class="btn ghost" id="btn-load-survey">부서 데이터 불러오기</button>
    <input type="file" id="file-survey" accept="application/json">
  </div>
</header>

<main>

  <!-- ===================== VIEW MODE ===================== -->
  <div id="view-mode">
    <aside class="sidebar">
      <h3>조직도</h3>
      <div class="tree" id="sidebar-tree"></div>
    </aside>
    <div class="content">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div id="dept-header-slot"></div>
      <div class="tabs" id="view-tabs">
        <button class="tab-btn" data-tab="overview">부서 현황</button>
        <button class="tab-btn" data-tab="driver">핵심동인분석</button>
        <button class="tab-btn" data-tab="ranking">랭킹·이상치</button>
        <button class="tab-btn" data-tab="confidence">응답신뢰도</button>
        <button class="tab-btn" data-tab="leadership">리더십비교</button>
        <button class="tab-btn" data-tab="variance">조직편차</button>
      </div>
      <div id="tab-content"></div>
    </div>
  </div>

  <!-- ===================== ADMIN MODE ===================== -->
  <div id="admin-mode" hidden>
    <div class="admin-panel">
      <div class="admin-toolbar">
        <button class="btn ghost" id="btn-load-orgmap">이전 회차 불러오기</button>
        <input type="file" id="file-orgmap" accept="application/json">
        <label>새 회차 이름</label>
        <input type="text" id="round-name-input" placeholder="예: 2026Q3">
        <button class="btn coral" id="btn-save-orgmap">현재 회차로 저장</button>
        <span style="color:var(--muted); font-size:12px;" id="admin-status"></span>
      </div>
      <div class="admin-hint">
        부서 노드를 드래그해서 다른 부서 위에 놓으면 그 부서의 하위 조직으로 이동합니다.
        A컬럼의 부서레벨은 참고용 숫자일 뿐이며, 실제 상하위 관계는 이 화면에서 구성한 트리 기준으로 계산됩니다.
      </div>
      <div class="root-dropzone" id="root-dropzone">최상위 부서로 만들려면 여기로 드래그하세요</div>
      <div class="admin-tree-wrap">
        <div class="admin-tree" id="admin-tree"></div>
      </div>
    </div>
  </div>

  <!-- ===================== REPORT MODE ===================== -->
  <div id="report-mode" hidden>
    <div class="report-panel">
      <div class="report-toolbar">
        <button class="btn coral" id="btn-copy-report">표 전체 복사 (엑셀·워드용)</button>
        <span id="report-copy-status"></span>
      </div>
      <div class="report-hint">모든 조직(전사~최하위 부서)과 부서장 정보를 한 표에 담았습니다. 아래 체크박스로 원하는 레벨·항목만 바로 골라서 보고, "표 전체 복사"로 엑셀/워드에 Ctrl+V 붙여넣으세요.</div>
      <div class="report-filters" id="report-filters">
        <div class="filter-group">
          <div class="filter-group-title">표시할 레벨
            <span class="filter-group-actions"><a href="#" data-action="levels-all">전체선택</a> · <a href="#" data-action="levels-none">전체해제</a></span>
          </div>
          <div id="report-level-checks"></div>
        </div>
        <div class="filter-group">
          <div class="filter-group-title">표시할 항목
            <span class="filter-group-actions"><a href="#" data-action="columns-all">전체선택</a> · <a href="#" data-action="columns-none">전체해제</a></span>
          </div>
          <div id="report-column-checks"></div>
        </div>
      </div>
      <div id="report-table-wrap" class="report-table-wrap"></div>
    </div>
  </div>

</main>

<script>

function childrenByParent() {
  const map = {};
  for (const [code, parent] of Object.entries(state.orgMap)) {
    if (parent) (map[parent] = map[parent] || []).push(code);
  }
  return map;

function rootCodes() {

function isDescendant(ancestorCode, code) {
  let cur = code;
  const guard = new Set();
  while (state.orgMap[cur]) {
    cur = state.orgMap[cur];
    if (cur === ancestorCode) return true;
    if (guard.has(cur)) return false; // corrupt map, bail out
    guard.add(cur);
  }
  return false;
}

/* =========================================================
   Rollup: response-count-weighted average up the org tree.
   Mirrors scripts/schema_utils.py rollup().
   ========================================================= */
function weightedAverage(pairs) {
  let total = 0, weight = 0;
  for (const [value, w] of pairs) {
    if (value === null || value === undefined || value === NO_DATA_MARKER) continue;
    if (w === null || w === undefined) continue;
    total += value * w;
    weight += w;
  }
  return weight === 0 ? null : total / weight;
}

let rollupCache = {};
function invalidateRollupCache() { rollupCache = {}; }

function rollup(code) {
  if (code in rollupCache) return rollupCache[code];
  const children = childrenByParent()[code] || [];
  const own = state.recordsByCode[code];

  if (children.length === 0) {
    rollupCache[code] = own || null;
    return rollupCache[code];
  }

  const childResults = children.map(rollup).filter(Boolean);
  if (childResults.length === 0) {
    rollupCache[code] = own || null;
    return rollupCache[code];
  }

  const targetCount = childResults.reduce((s, c) => s + (c.target_count || 0), 0);
  const responseCount = childResults.reduce((s, c) => s + (c.response_count || 0), 0);
  const responseRate = targetCount ? responseCount / targetCount : null;

  const areaScores = {};
  const areaKeys = AREA_DEFS.map(a => a.key);
  for (const key of areaKeys) {
    areaScores[key] = weightedAverage(childResults.map(c => [c.area_scores?.[key], c.response_count]));
  }

  const itemScores = {};
  for (const area of AREA_DEFS) for (const item of area.items) {
    itemScores[item.key] = weightedAverage(childResults.map(c => [c.item_scores?.[item.key], c.response_count]));
  }

  const questionScores = {};
  for (const area of AREA_DEFS) for (const item of area.items) {
    for (let i = 1; i <= item.qCount; i++) {
      const qKey = `${item.key}_${i}`;
      questionScores[qKey] = weightedAverage(childResults.map(c => [c.question_scores?.[qKey], c.response_count]));
    }
  }

  const areaYoy = own && own.area_yoy && Object.keys(own.area_yoy).length
    ? own.area_yoy
    : Object.fromEntries(areaKeys.map(k => [k, NO_DATA_MARKER]));

  const base = own || childResults[0];
  rollupCache[code] = {
    dept_level: base.dept_level,
    dept_name: base.dept_name,
    dept_code: code,
    target_count: targetCount,
    response_count: responseCount,
    response_rate: responseRate,
    leader_id: own ? own.leader_id : null,
    leader_name: own ? own.leader_name : null,
    area_scores: areaScores,
    area_yoy: areaYoy,
    item_scores: itemScores,
    question_scores: questionScores,
    _rolled_up: true,
  };
  return rollupCache[code];
}

/* =========================================================
   Basic statistics helpers
   ========================================================= */
function mean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null; }
function stddev(arr) {
  if (arr.length < 2) return 0;
  const m = mean(arr);
  return Math.sqrt(mean(arr.map(x => (x - m) ** 2)));
}
function quantile(sortedArr, q) {
  if (!sortedArr.length) return null;
  const pos = (sortedArr.length - 1) * q;
  const lo = Math.floor(pos), hi = Math.ceil(pos);
  if (lo === hi) return sortedArr[lo];
  return sortedArr[lo] + (sortedArr[hi] - sortedArr[lo]) * (pos - lo);
}
function pearsonR(xs, ys) {
  const n = xs.length;
  if (n < 2) return null;
  const mx = mean(xs), my = mean(ys);
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) {
    const dx = xs[i] - mx, dy = ys[i] - my;
    sxy += dx * dy; sxx += dx * dx; syy += dy * dy;
  }
  if (sxx === 0 || syy === 0) return null;
  return sxy / Math.sqrt(sxx * syy);
}
function linearRegression1D(xs, ys) {
  const n = xs.length;
  if (n < 2) return null;
  const mx = mean(xs), my = mean(ys);
  let sxy = 0, sxx = 0;
  for (let i = 0; i < n; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2; }
  if (sxx === 0) return null;
  const slope = sxy / sxx;
  return { slope, intercept: my - slope * mx };
}

/* ---- small matrix library (only used for the key-driver regression) ---- */
function transpose(m) { return m[0].map((_, j) => m.map(row => row[j])); }
function matMul(a, b) {
  const out = [];
  for (let i = 0; i < a.length; i++) {
    out.push(b[0].map((_, j) => a[i].reduce((s, v, k) => s + v * b[k][j], 0)));
  }
  return out;
}
function matVec(a, v) { return a.map(row => row.reduce((s, x, i) => s + x * v[i], 0)); }
function invertMatrix(m) {
  const n = m.length;
  const aug = m.map((row, i) => [...row, ...Array.from({ length: n }, (_, j) => (i === j ? 1 : 0))]);
  for (let col = 0; col < n; col++) {
    let pivotRow = col;
    for (let r = col + 1; r < n; r++) if (Math.abs(aug[r][col]) > Math.abs(aug[pivotRow][col])) pivotRow = r;
    if (Math.abs(aug[pivotRow][col]) < 1e-10) return null; // singular
    [aug[col], aug[pivotRow]] = [aug[pivotRow], aug[col]];
    const pivot = aug[col][col];
    for (let j = 0; j < 2 * n; j++) aug[col][j] /= pivot;
    for (let r = 0; r < n; r++) {
      if (r === col) continue;
      const factor = aug[r][col];
      for (let j = 0; j < 2 * n; j++) aug[r][j] -= factor * aug[col][j];
    }
  }
  return aug.map(row => row.slice(n));
}
function standardizeColumns(X) {
  const n = X.length, p = X[0].length;
  const means = [], stds = [];
  for (let j = 0; j < p; j++) {
    const col = X.map(row => row[j]);
    means.push(mean(col));
    stds.push(stddev(col) || 1);
  }
  return X.map(row => row.map((v, j) => (v - means[j]) / stds[j]));
}
function standardizeVector(v) {
  const m = mean(v), sd = stddev(v) || 1;
  return v.map(x => (x - m) / sd);
}
/** Standardized multiple-regression coefficients (beta) via OLS normal
 * equations on z-scored X/y. Returns null if the sample is too small
 * or the predictor matrix is singular (e.g. near-collinear items). */
function standardizedRegressionBetas(X, y) {
  if (X.length <= X[0].length) return null;
  const Xz = standardizeColumns(X);
  const yz = standardizeVector(y);
  const Xt = transpose(Xz);
  const XtXInv = invertMatrix(matMul(Xt, Xz));
  if (!XtXInv) return null;
  return matVec(XtXInv, matVec(Xt, yz));
}

function overallScore(rec) {

function siblingGroup(code) {

  return Object.keys(state.orgMap).filter(c => state.orgMap[c] === parent);
}
function confidenceLevel(rate) {
  if (rate === null || rate === undefined) return "unknown";
  if (rate >= ANALYSIS.RESPONSE_RATE_TRUSTED) return "trusted";
  if (rate >= ANALYSIS.RESPONSE_RATE_CAUTION) return "caution";
  return "warning";
}
const CONFIDENCE_LABEL = { trusted: "신뢰", caution: "주의", warning: "경고", unknown: "-" };

}

let companyBetasCache = null;
function computeCompanyBetas() {
  if (companyBetasCache) return companyBetasCache;
  const units = surveyUnits().filter(r => r.response_count >= ANALYSIS.MIN_RESPONSES);
  if (units.length < ANALYSIS.MIN_LEAF_SAMPLE_FOR_REGRESSION) {
    companyBetasCache = { ok: false, n: units.length, required: ANALYSIS.MIN_LEAF_SAMPLE_FOR_REGRESSION };
    return companyBetasCache;
  }
  const X = units.map(r => DRIVER_ITEMS.map(k => r.item_scores[k]));
  const y = units.map(r => r.item_scores[FINAL_SATISFACTION_ITEM]);
  const beta = standardizedRegressionBetas(X, y);
  if (!beta) {
    companyBetasCache = { ok: false, n: units.length, reason: "singular" };
    return companyBetasCache;
  }
  const betas = DRIVER_ITEMS.map((item, i) => ({ item, beta: beta[i] }))
    .sort((a, b) => Math.abs(b.beta) - Math.abs(a.beta));
  companyBetasCache = { ok: true, n: units.length, betas };
  return companyBetasCache;
}

function evaluateRisk(code, groupCache) {
  const group = siblingGroup(code);
  if (!group || group.length < ANALYSIS.MIN_GROUP_SIZE_FOR_STATS) return null;
  const rec = rollup(code);
  if (!rec) return null;
  const reasons = [];
  for (const area of AREA_DEFS) {
    const groupRecs = group.map(c => rollup(c)).filter(Boolean);
    const scores = groupRecs.map(r => r.area_scores?.[area.key]).filter(v => typeof v === "number");
    if (scores.length >= ANALYSIS.MIN_GROUP_SIZE_FOR_STATS) {
      const sorted = [...scores].sort((a, b) => a - b);
      const p10 = quantile(sorted, ANALYSIS.RISK_BOTTOM_PERCENTILE);
      const myScore = rec.area_scores?.[area.key];
      if (typeof myScore === "number" && myScore <= p10) reasons.push(`${area.key} 하위 10%`);
    }
    const yoys = groupRecs.map(r => r.area_yoy?.[area.key]).filter(v => typeof v === "number");
    const myYoy = rec.area_yoy?.[area.key];
    if (yoys.length >= ANALYSIS.MIN_GROUP_SIZE_FOR_STATS && typeof myYoy === "number" && myYoy < 0) {
      const avgYoy = mean(yoys);
      if (myYoy < avgYoy) reasons.push(`${area.key} 전년비 하락폭 그룹평균 초과`);
    }
  }
  return reasons.length ? { code, name: rec.dept_name, reasons } : null;
}
function computeRiskList(scopeCode) {
  const results = [];
  const seen = new Set();
  function visit(code) {
    const kids = childrenByParent()[code] || [];
    for (const child of kids) {
      if (!seen.has(child)) {
        seen.add(child);
        const r = evaluateRisk(child, null);
        if (r) results.push(r);
      }
      visit(child);
    }
  }
  visit(scopeCode);
  return results;
}

function computeLeaderStats() {
  const units = surveyUnits();
  const byLeader = {};
  for (const u of units) {
    if (!u.leader_id) continue;
    (byLeader[u.leader_id] = byLeader[u.leader_id] || { leader_id: u.leader_id, leader_name: u.leader_name, depts: [] }).depts.push(u);
  }
  const leaders = Object.values(byLeader).map(l => {
    const totalTarget = l.depts.reduce((s, d) => s + d.target_count, 0);
    const totalResponse = l.depts.reduce((s, d) => s + d.response_count, 0);
    const overall = weightedAverage(l.depts.map(d => [overallScore(d), d.response_count]));
    const areaScores = {};
    for (const area of AREA_DEFS) areaScores[area.key] = weightedAverage(l.depts.map(d => [d.area_scores[area.key], d.response_count]));
    return { ...l, deptCount: l.depts.length, totalTarget, totalResponse, overall, areaScores };
  });
  leaders.sort((a, b) => (b.overall ?? -Infinity) - (a.overall ?? -Infinity));
  return leaders;
}

/* ---- tiny inline-SVG scatter plot (no chart library, single-file constraint) ---- */
function renderScatterSVG({ points, xDomain, yDomain, width = 620, height = 300, highlightCode, trendLine }) {
  const pad = { l: 46, r: 16, t: 12, b: 34 };
  const plotW = width - pad.l - pad.r, plotH = height - pad.t - pad.b;
  const xScale = v => pad.l + ((v - xDomain[0]) / (xDomain[1] - xDomain[0] || 1)) * plotW;
  const yScale = v => pad.t + plotH - ((v - yDomain[0]) / (yDomain[1] - yDomain[0] || 1)) * plotH;

  const dots = points.map(p => {
    const isHi = p.code && p.code === highlightCode;
    const r = isHi ? 6.5 : 4;
    return `<circle cx="${xScale(p.x).toFixed(1)}" cy="${yScale(p.y).toFixed(1)}" r="${r}" fill="${p.color || "var(--coral)"}" stroke="${isHi ? "var(--navy-900)" : "#fff"}" stroke-width="${isHi ? 2 : 1}"><title>${escapeHtml(p.label || "")}</title></circle>`;
  }).join("");

  let trendSvg = "";
  if (trendLine) {
    const x1 = xDomain[0], x2 = xDomain[1];
    const y1 = trendLine.slope * x1 + trendLine.intercept;
    const y2 = trendLine.slope * x2 + trendLine.intercept;
    trendSvg = `<line x1="${xScale(x1).toFixed(1)}" y1="${yScale(y1).toFixed(1)}" x2="${xScale(x2).toFixed(1)}" y2="${yScale(y2).toFixed(1)}" stroke="var(--navy-600)" stroke-width="1.5" stroke-dasharray="4 3" />`;
  }

  const axisLine = `<line x1="${pad.l}" y1="${pad.t + plotH}" x2="${pad.l + plotW}" y2="${pad.t + plotH}" stroke="var(--border)" />
    <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t + plotH}" stroke="var(--border)" />`;
  const xTicks = [xDomain[0], (xDomain[0] + xDomain[1]) / 2, xDomain[1]].map(v =>
    `<text x="${xScale(v).toFixed(1)}" y="${pad.t + plotH + 18}" font-size="10" fill="var(--muted)" text-anchor="middle">${Number.isInteger(v) ? v : v.toFixed(1)}</text>`
  ).join("");
  const yTicks = [yDomain[0], (yDomain[0] + yDomain[1]) / 2, yDomain[1]].map(v =>
    `<text x="${pad.l - 8}" y="${(yScale(v) + 3).toFixed(1)}" font-size="10" fill="var(--muted)" text-anchor="end">${v.toFixed(0)}</text>`
  ).join("");

  return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}">${axisLine}${xTicks}${yTicks}${trendSvg}${dots}</svg>`;
}

/** Horizontal bar chart (used by the key-driver tab) as inline SVG,
 * so it can be captured as an image the same way as the scatter plots. */
function renderBarChartSVG(bars, { width = 620, barHeight = 24, gap = 10, labelWidth = 90, valueWidth = 64 } = {}) {
  const height = bars.length * (barHeight + gap) + gap;
  const trackWidth = Math.max(40, width - labelWidth - valueWidth - 20);
  const maxAbs = Math.max(...bars.map(b => Math.abs(b.value)), 0.001);
  const rows = bars.map((b, i) => {
    const y = gap + i * (barHeight + gap);
    const barW = (Math.abs(b.value) / maxAbs) * trackWidth;
    const barColor = b.value < 0 ? "var(--navy-600)" : "var(--coral)";
    const trackX = labelWidth + 10;
    return `<text x="${labelWidth - 8}" y="${(y + barHeight / 2 + 4).toFixed(1)}" font-size="12.5" text-anchor="end" fill="var(--navy-800)" font-weight="700">${escapeHtml(b.label)}</text>
      <rect x="${trackX}" y="${y}" width="${trackWidth}" height="${barHeight}" rx="4" fill="var(--navy-100)" />
      <rect x="${trackX}" y="${y}" width="${barW.toFixed(1)}" height="${barHeight}" rx="4" fill="${barColor}" />
      <text x="${(trackX + trackWidth + 10).toFixed(1)}" y="${(y + barHeight / 2 + 4).toFixed(1)}" font-size="12.5" fill="var(--navy-900)" font-weight="700">${b.value >= 0 ? "+" : ""}${b.value.toFixed(3)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}">${rows}</svg>`;
}

/** Min-max "range track" (used by the org-variance tab) as inline SVG:
 * a shaded band from lowest to highest child score, a mean marker, and
 * one dot per child. */
function renderRangeTrackSVG(values, highlightCode, { trackMin = 40, trackMax = 100, width = 620, height = 60 } = {}) {
  const padX = 16;
  const scaleX = v => padX + ((v - trackMin) / (trackMax - trackMin)) * (width - padX * 2);
  const nums = values.map(v => v.value);
  const lo = Math.min(...nums), hi = Math.max(...nums), m = mean(nums);
  const trackY = height / 2;
  const parts = [
    `<rect x="${padX}" y="${trackY - 10}" width="${width - padX * 2}" height="20" rx="10" fill="var(--navy-100)" />`,
    `<rect x="${scaleX(lo).toFixed(1)}" y="${trackY - 10}" width="${(scaleX(hi) - scaleX(lo)).toFixed(1)}" height="20" rx="10" fill="rgba(255,111,94,0.28)" />`,
    `<line x1="${scaleX(m).toFixed(1)}" y1="${trackY - 17}" x2="${scaleX(m).toFixed(1)}" y2="${trackY + 17}" stroke="var(--navy-900)" stroke-width="2" />`,
  ];
  for (const v of values) {
    const isHi = v.code === highlightCode;
    parts.push(`<circle cx="${scaleX(v.value).toFixed(1)}" cy="${trackY}" r="${isHi ? 7 : 6}" fill="${isHi ? "var(--gold)" : "var(--coral)"}" stroke="#fff" stroke-width="2"><title>${escapeHtml(v.label)}: ${v.value.toFixed(1)}</title></circle>`);
  }
  return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}">${parts.join("")}</svg>`;
}

/** Wraps any inline-SVG chart markup with a "그래프 이미지로 복사" button
 * and optional caption. The button is wired via one delegated listener
 * (see Wiring) so it works for charts inserted at any point. */
function chartBlockHtml(svgHtml, chartName, captionHtml) {
  return `<div class="chart-block">
    <div class="chart-toolbar">
      <button class="btn ghost btn-capture-chart" data-chart-name="${escapeHtml(chartName)}">그래프 이미지로 복사</button>
      <span class="chart-copy-status"></span>
    </div>
    <div class="svg-chart-wrap">${svgHtml}</div>
    ${captionHtml ? `<div class="scatter-caption">${captionHtml}</div>` : ""}
  </div>`;
}

/** Resolve the theme's CSS custom properties (var(--coral) etc.) into
 * concrete colors and inline them into a cloned SVG. A data-URI <img>
 * is rendered as its own isolated document, so it can't see the host
 * page's :root variables — without this, every themed color in the
 * captured chart would fall back to black. */
const CHART_CSS_VARS = [
  "--navy-900", "--navy-800", "--navy-700", "--navy-600", "--navy-100",
  "--coral", "--coral-dark", "--gold", "--gold-light",
  "--positive", "--negative", "--muted", "--border", "--text",
];
function inlineCssVarsIntoSvg(svgEl) {
  const clone = svgEl.cloneNode(true);
  const cs = getComputedStyle(document.documentElement);
  const rules = CHART_CSS_VARS.map(v => `${v}: ${cs.getPropertyValue(v).trim()};`).join(" ");
  const styleEl = document.createElementNS("http://www.w3.org/2000/svg", "style");
  styleEl.textContent = `:root { ${rules} } text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; }`;
  clone.insertBefore(styleEl, clone.firstChild);
  if (!clone.getAttribute("xmlns")) clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  return clone;
}

function svgToPngBlob(svgEl, scale = 2) {
  return new Promise((resolve, reject) => {
    const clone = inlineCssVarsIntoSvg(svgEl);
    const w = clone.viewBox?.baseVal?.width || svgEl.clientWidth || 620;
    const h = clone.viewBox?.baseVal?.height || svgEl.clientHeight || 300;
    const xml = new XMLSerializer().serializeToString(clone);
    const svg64 = "data:image/svg+xml;charset=utf-8;base64," + btoa(unescape(encodeURIComponent(xml)));
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff"; // flatten transparency to white so it pastes cleanly into docs
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(blob => (blob ? resolve(blob) : reject(new Error("toBlob failed"))), "image/png");
    };
    img.onerror = () => reject(new Error("SVG image load failed"));
    img.src = svg64;
  });
}

function showTransientStatus(el, msg, ms = 4000) {
  if (!el) return;
  el.textContent = msg;
  setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, ms);
}

async function copyChartImage(svgEl, statusEl, filename) {
  try {
    const blob = await svgToPngBlob(svgEl);
    if (navigator.clipboard && window.ClipboardItem) {
      try {
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        showTransientStatus(statusEl, "복사되었습니다. Ctrl+V로 붙여넣으세요.");
        return;
      } catch (err) { /* clipboard write refused (e.g. no permission) — fall back to a download */ }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename || "chart.png";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showTransientStatus(statusEl, "클립보드 복사가 지원되지 않아 이미지 파일로 다운로드했습니다.");
  } catch (err) {
    showTransientStatus(statusEl, "이미지 생성에 실패했습니다.");
  }
}

/* =========================================================
   Rendering helpers
   ========================================================= */
function fmtScore(v) {
  if (v === null || v === undefined || v === NO_DATA_MARKER) return "-";
  return v.toFixed(1);
}
function fmtPct(v) {
  if (v === null || v === undefined) return "-";
  return (v * 100).toFixed(1) + "%";
}
function yoyHtml(v) {
  if (v === null || v === undefined || v === NO_DATA_MARKER) {
    return `<span class="yoy none">데이터 없음</span>`;
  }
  const cls = v > 0 ? "up" : v < 0 ? "down" : "none";
  const arrow = v > 0 ? "▲" : v < 0 ? "▼" : "－";
  return `<span class="yoy ${cls}">${arrow} 전년비 ${Math.abs(v).toFixed(1)}</span>`;
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function breadcrumbPath(code) {
  const path = [];
  let cur = code;
  const guard = new Set();
  while (cur) {
    path.unshift(cur);
    const parent = state.orgMap[cur];
    if (!parent || guard.has(parent)) break;
    guard.add(parent);
    cur = parent;
  }
  return path;
}

function renderBreadcrumb() {
  const el = document.getElementById("breadcrumb");
  if (!state.selectedCode) { el.innerHTML = ""; return; }
  const path = breadcrumbPath(state.selectedCode);
  el.innerHTML = path.map((code, i) => {
    const rec = state.recordsByCode[code];
    const name = rec ? escapeHtml(rec.dept_name) : code;
    const isLast = i === path.length - 1;
    const sep = i > 0 ? `<span class="sep">›</span>` : "";
    return `${sep}<span class="crumb ${isLast ? "current" : ""}" data-code="${code}">${name}</span>`;
  }).join("");
  el.querySelectorAll(".crumb:not(.current)").forEach(elm => {
    elm.addEventListener("click", () => { state.selectedCode = elm.dataset.code; renderViewMode(); });
  });
}

function renderTreeNode(code, container, opts) {
  const rec = state.recordsByCode[code];
  const kids = childrenByParent()[code] || [];
  const li = document.createElement("li");

  const row = document.createElement("div");
  row.className = "node-row" + (code === state.selectedCode ? " selected" : "");

  const toggle = document.createElement("span");
  if (kids.length) {
    toggle.className = "toggle";
    toggle.textContent = state.expandedTreeNodes.has(code) ? "▾" : "▸";
    toggle.addEventListener("click", (e) => {
      e.stopPropagation();
      if (state.expandedTreeNodes.has(code)) state.expandedTreeNodes.delete(code);
      else state.expandedTreeNodes.add(code);
      renderSidebarTree();
    });
  } else {
    toggle.className = "leaf-dot";
    toggle.textContent = "·";
  }
  row.appendChild(toggle);

  const label = document.createElement("span");
  label.textContent = rec ? rec.dept_name : code;
  row.appendChild(label);

  row.addEventListener("click", () => {
    state.selectedCode = code;
    state.expandedTreeNodes.add(code);
    renderViewMode();
  });

  li.appendChild(row);

  if (kids.length && state.expandedTreeNodes.has(code)) {
    const ul = document.createElement("ul");
    for (const k of kids) renderTreeNode(k, ul, opts);
    li.appendChild(ul);
  }
  container.appendChild(li);
}

function renderSidebarTree() {
  const el = document.getElementById("sidebar-tree");
  el.innerHTML = "";
  const ul = document.createElement("ul");
  for (const root of rootCodes()) renderTreeNode(root, ul, {});
  el.appendChild(ul);
}

/* =========================================================
   Tab 0: 부서 현황 (area/item/question scores)
   ========================================================= */
function renderOverviewTab(container, data) {
  let html = `<div class="section-title">영역별 점수</div><div class="area-grid">`;
  for (const area of AREA_DEFS) {
    html += `<div class="area-card">
      <div class="area-name">${escapeHtml(area.key)}</div>
      <div class="area-score">${fmtScore(data.area_scores[area.key])}</div>
      <div class="yoy-wrap">${yoyHtml(data.area_yoy ? data.area_yoy[area.key] : null)}</div>
    </div>`;
  }
  html += `</div>`;

  html += `<div class="section-title">항목별 점수 (클릭 시 문항 펼치기)</div><div class="item-grid">`;
  for (const area of AREA_DEFS) {
    for (const item of area.items) {
      const expanded = state.expandedItems.has(item.key);
      html += `<div class="item-card ${expanded ? "expanded" : ""}" data-item="${item.key}">
        <span class="chevron">${expanded ? "▾" : "▸"}</span>
        <div class="item-area-tag">${escapeHtml(area.key)}</div>
        <div class="item-name">${escapeHtml(item.key)}</div>
        <div class="item-score">${fmtScore(data.item_scores[item.key])}</div>
      </div>`;
      if (expanded) {
        html += `<div class="question-list">`;
        for (let i = 1; i <= item.qCount; i++) {
          const qKey = `${item.key}_${i}`;
          const label = item.qCount === 1 ? item.key : `${item.key} 문항${i}`;
          html += `<div class="q-row"><span class="q-label">${escapeHtml(label)}</span><span class="q-score">${fmtScore(data.question_scores[qKey])}</span></div>`;
        }
        html += `</div>`;
      }
    }
  }
  html += `</div>`;

  container.innerHTML = html;
  container.querySelectorAll(".item-card").forEach(card => {
    card.addEventListener("click", () => {
      const key = card.dataset.item;
      if (state.expandedItems.has(key)) state.expandedItems.delete(key);
      else state.expandedItems.add(key);
      renderTabContent();
    });
  });
}

/* =========================================================
   Tab 1: 핵심동인분석 (key driver regression)
   ========================================================= */
function renderDriverTab(container, data) {
  const result = computeCompanyBetas();
  if (!result.ok) {
    container.innerHTML = `<div class="tab-panel-desc">12개 항목 중 무엇이 "회사만족"에 가장 큰 영향을 주는지 표준화 회귀계수(베타)로 산출합니다.</div>
      <div class="note-box warning">표본 부족으로 분석 제외 (전사 유효 부서 ${result.n}개 / 최소 ${result.required ?? "-"}개 필요)</div>`;
    return;
  }

  const barSvg = renderBarChartSVG(result.betas.map(b => ({ label: b.item, value: b.beta })));

  let html = `<div class="tab-panel-desc">전사 응답 데이터(유효 부서 ${result.n}개) 기준 표준화 회귀계수입니다. 절대값이 클수록 "회사만족"에 미치는 영향력이 큽니다.</div>
    ${chartBlockHtml(barSvg, `핵심동인분석_${data.dept_name}`)}`;

  const isRoot = !state.orgMap[state.selectedCode];
  if (!isRoot) {
    const companyAvg = rollup(rootCodes()[0])?.item_scores || {};
    const rows = DRIVER_ITEMS.map(item => {
      const beta = result.betas.find(b => b.item === item)?.beta ?? 0;
      const deptScore = data.item_scores[item];
      const avgScore = companyAvg[item];
      const gap = (typeof deptScore === "number" && typeof avgScore === "number") ? deptScore - avgScore : null;
      const priority = (beta > 0 && gap !== null) ? beta * Math.max(0, -gap) : 0;
      return { item, beta, deptScore, avgScore, gap, priority };
    }).sort((a, b) => b.priority - a.priority);

    html += `<div class="section-title">"${escapeHtml(data.dept_name)}" 전사 대비 우선 개선 항목</div>
      <div class="tab-panel-desc">전사 기준 영향력(베타)이 크면서 전사 평균보다 낮은 항목일수록 상단에 표시됩니다. 표본이 적은 부서는 자체 회귀분석 대신 이 방식으로 취약 항목을 판단합니다.</div>
      <table class="data-table">
        <thead><tr><th>항목</th><th>전사 베타</th><th>부서 점수</th><th>전사 평균</th><th>차이</th></tr></thead>
        <tbody>${rows.map(r => `<tr class="${r.priority > 0 ? "outlier-row" : ""}">
          <td>${escapeHtml(r.item)}</td>
          <td>${r.beta >= 0 ? "+" : ""}${r.beta.toFixed(3)}</td>
          <td>${fmtScore(r.deptScore)}</td>
          <td>${fmtScore(r.avgScore)}</td>
          <td>${r.gap === null ? "-" : (r.gap >= 0 ? "+" : "") + r.gap.toFixed(1)}</td>
        </tr>`).join("")}</tbody>
      </table>`;
  }
  container.innerHTML = html;
}

/* =========================================================
   Tab 2: 부서 랭킹 & 이상치 탐지 (+ 위험군 리스트)
   ========================================================= */
function renderRankingTab(container, data) {
  let html = "";
  const group = siblingGroup(state.selectedCode);
  if (!group) {
    html += `<div class="note-box">최상위 조직은 비교할 형제 부서가 없습니다.</div>`;
  } else {
    const rows = group.map(c => ({ code: c, rec: rollup(c) })).filter(r => r.rec);
    const overallVals = rows.map(r => overallScore(r.rec)).filter(v => v !== null);
    const m = mean(overallVals), sd = stddev(overallVals);
    const sortedVals = [...overallVals].sort((a, b) => a - b);
    const q1 = quantile(sortedVals, 0.25), q3 = quantile(sortedVals, 0.75);
    const iqr = (q1 !== null && q3 !== null) ? q3 - q1 : 0;
    const lowerFence = (q1 ?? -Infinity) - 1.5 * iqr, upperFence = (q3 ?? Infinity) + 1.5 * iqr;
    rows.forEach(r => {
      r.overall = overallScore(r.rec);
      r.z = (r.overall !== null && sd) ? (r.overall - m) / sd : 0;
      r.outlier = r.overall !== null && (Math.abs(r.z) >= ANALYSIS.OUTLIER_Z || r.overall < lowerFence || r.overall > upperFence);
    });
    rows.sort((a, b) => (b.overall ?? -Infinity) - (a.overall ?? -Infinity));

    const parentName = rollup(state.orgMap[state.selectedCode])?.dept_name ?? "";
    html += `<div class="tab-panel-desc">"${escapeHtml(parentName)}" 산하 동일 계층 부서 ${rows.length}개를 비교합니다 (그룹 평균 ${m === null ? "-" : m.toFixed(1)}, 표준편차 ${sd === null ? "-" : sd.toFixed(1)}). 이상치 기준: |Z| ≥ ${ANALYSIS.OUTLIER_Z} 또는 IQR 벗어남.</div>
      <table class="data-table">
        <thead><tr><th>#</th><th>부서</th><th>종합점수</th><th>Z-score</th><th>즐거운일</th><th>함께하는동료</th><th>자랑스러운회사</th><th></th></tr></thead>
        <tbody>${rows.map((r, i) => `<tr class="${r.code === state.selectedCode ? "selected-row" : ""} ${r.outlier ? "outlier-row" : ""}">
          <td>${i + 1}</td>
          <td>${escapeHtml(r.rec.dept_name)}</td>
          <td>${fmtScore(r.overall)}</td>
          <td>${r.z.toFixed(2)}</td>
          <td>${fmtScore(r.rec.area_scores["즐거운일"])}</td>
          <td>${fmtScore(r.rec.area_scores["함께하는동료"])}</td>
          <td>${fmtScore(r.rec.area_scores["자랑스러운회사"])}</td>
          <td>${r.outlier ? '<span class="badge warning">이상치</span>' : ""}</td>
        </tr>`).join("")}</tbody>
      </table>`;
  }

  const riskList = computeRiskList(state.selectedCode);
  html += `<div class="section-title">위험군 리스트 ("${escapeHtml(data.dept_name)}" 산하)</div>
    <div class="tab-panel-desc">동일 그룹 내 영역 점수 하위 10%, 또는 전년비 하락폭이 그룹 평균보다 큰 부서입니다.</div>`;
  if (!riskList.length) {
    html += `<div class="note-box">현재 조건에 해당하는 위험군 부서가 없습니다.</div>`;
  } else {
    html += `<table class="data-table"><thead><tr><th>부서</th><th>사유</th></tr></thead><tbody>
      ${riskList.map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${r.reasons.map(reason => `<span class="chip risk">${escapeHtml(reason)}</span>`).join("")}</td></tr>`).join("")}
    </tbody></table>`;
  }
  container.innerHTML = html;
}

/* =========================================================
   Tab 3: 응답률-점수 신뢰도 분석
   ========================================================= */
function renderConfidenceTab(container, data) {
  let html = `<div class="tab-panel-desc">응답률 ${(ANALYSIS.RESPONSE_RATE_TRUSTED * 100).toFixed(0)}% 이상: 신뢰 · ${(ANALYSIS.RESPONSE_RATE_CAUTION * 100).toFixed(0)}~${(ANALYSIS.RESPONSE_RATE_TRUSTED * 100).toFixed(0)}%: 주의 · 미만: 경고(표본 부족, 참고용)</div>
    <div class="stat-row">
      <div class="stat-box"><div class="v">${fmtPct(data.response_rate)}</div><div class="l">응답률</div></div>
      <div class="stat-box"><div class="v">${confidenceBadgeHtml(data.response_rate)}</div><div class="l">신뢰도</div></div>
    </div>`;
  if (confidenceLevel(data.response_rate) === "warning") {
    html += `<div class="note-box warning">이 부서는 응답률이 ${(ANALYSIS.RESPONSE_RATE_CAUTION * 100).toFixed(0)}% 미만으로 표본이 부족합니다. 점수는 참고용으로만 활용하세요.</div>`;
  }

  const units = surveyUnits();
  const points = units.map(u => {
    const y = overallScore(u);
    const level = confidenceLevel(u.response_rate);
    return {
      x: u.response_rate * 100, y, code: u.dept_code,
      label: `${u.dept_name} (응답률 ${fmtPct(u.response_rate)}, 점수 ${fmtScore(y)})`,
      color: level === "trusted" ? "var(--positive)" : level === "caution" ? "var(--gold)" : "var(--coral)",
    };
  }).filter(p => p.y !== null);

  html += `<div class="section-title">응답률 vs 점수 산점도 (전사 전체 부서)</div>`;
  if (points.length < 2) {
    html += `<div class="note-box">산점도를 그리기에 데이터가 부족합니다.</div>`;
  } else {
    const ys = points.map(p => p.y);
    const r = pearsonR(points.map(p => p.x), ys);
    const svg = renderScatterSVG({ points, xDomain: [0, 100], yDomain: [Math.min(...ys) - 3, Math.max(...ys) + 3], highlightCode: data.dept_code });
    html += chartBlockHtml(svg, `응답신뢰도_${data.dept_name}`,
      `X: 응답률(%) · Y: 종합점수 · 상관계수 r = ${r === null ? "-" : r.toFixed(2)} · 진한 테두리 = 현재 선택 부서`);
  }
  container.innerHTML = html;
}

/* =========================================================
   Tab 4: 부서장(리더십)별 비교
   ========================================================= */
function renderLeadershipTab(container, data) {
  const leaders = computeLeaderStats();
  const currentLeaderId = state.recordsByCode[state.selectedCode]?.leader_id;

  let html = `<div class="tab-panel-desc">이번 회차 부서장ID 기준으로만 집계합니다 (과거 이력 미포함). 담당 부서·인원 규모가 다른 리더를 공정하게 비교하기 위해 응답인원 가중평균을 사용합니다.</div>
    <table class="data-table"><thead><tr><th>#</th><th>부서장</th><th>담당부서</th><th>담당인원</th><th>응답인원</th><th>종합점수</th></tr></thead><tbody>
      ${leaders.map((l, i) => `<tr class="${l.leader_id === currentLeaderId ? "selected-row" : ""}">
        <td>${i + 1}</td>
        <td>${escapeHtml(l.leader_name)} <span class="code">(${escapeHtml(l.leader_id)})</span></td>
        <td>${l.deptCount}개 · ${l.depts.map(d => escapeHtml(d.dept_name)).join(", ")}</td>
        <td>${l.totalTarget}명</td>
        <td>${l.totalResponse}명</td>
        <td>${fmtScore(l.overall)}</td>
      </tr>`).join("")}
    </tbody></table>`;

  const points = leaders.filter(l => l.overall !== null).map(l => ({ x: l.totalTarget, y: l.overall, code: l.leader_id, label: `${l.leader_name} (담당 ${l.totalTarget}명, ${fmtScore(l.overall)}점)` }));
  html += `<div class="section-title">담당 인원 규모 대비 점수</div>`;
  if (points.length < 2) {
    html += `<div class="note-box">비교할 리더가 부족합니다.</div>`;
  } else {
    const xs = points.map(p => p.x), ys = points.map(p => p.y);
    const trend = linearRegression1D(xs, ys);
    const r = pearsonR(xs, ys);
    const svg = renderScatterSVG({ points, xDomain: [0, Math.max(...xs) * 1.1], yDomain: [Math.min(...ys) - 3, Math.max(...ys) + 3], highlightCode: currentLeaderId, trendLine: trend });
    html += chartBlockHtml(svg, "리더십비교",
      `X: 담당 인원(대상) · Y: 종합점수(가중평균) · 규모-점수 상관계수 r = ${r === null ? "-" : r.toFixed(2)}`);
  }
  container.innerHTML = html;
}

/* =========================================================
   Tab 5: 조직 내부 편차 분석
   ========================================================= */
function renderVarianceTab(container, data) {
  const kids = childrenByParent()[state.selectedCode] || [];
  if (!kids.length) {
    container.innerHTML = `<div class="note-box">최하위 부서는 편차 분석 대상이 아닙니다. 하위 조직이 있는 부서를 선택하세요.</div>`;
    return;
  }
  const rows = kids.map(c => ({ code: c, rec: rollup(c) })).filter(r => r.rec);
  const overallVals = rows.map(r => overallScore(r.rec)).filter(v => v !== null);
  if (overallVals.length < 2) {
    container.innerHTML = `<div class="note-box">표본 부족으로 분석 제외 (하위 부서 ${overallVals.length}개).</div>`;
    return;
  }

  const m = mean(overallVals), sd = stddev(overallVals);
  const lo = Math.min(...overallVals), hi = Math.max(...overallVals);
  const companyAvg = overallScore(rollup(rootCodes()[0]));

  let labelClass, labelText;
  if (sd < ANALYSIS.VARIANCE_LOW_STDDEV) {
    if (companyAvg !== null && m >= companyAvg) { labelClass = "even-good"; labelText = "내부적으로 고르게 우수한 조직"; }
    else { labelClass = "even-bad"; labelText = "내부적으로 고르게 저조한 조직"; }
  } else {
    labelClass = "spread"; labelText = "부서 간 편차가 큰 조직";
  }

  let html = `<div class="variance-label ${labelClass}">${labelText}</div>
    <div class="stat-row">
      <div class="stat-box"><div class="v">${m.toFixed(1)}</div><div class="l">평균</div></div>
      <div class="stat-box"><div class="v">${sd.toFixed(1)}</div><div class="l">표준편차</div></div>
      <div class="stat-box"><div class="v">${lo.toFixed(1)} ~ ${hi.toFixed(1)}</div><div class="l">최소 ~ 최대</div></div>
      <div class="stat-box"><div class="v">${(hi - lo).toFixed(1)}</div><div class="l">범위(Range)</div></div>
    </div>
    <div class="section-title">하위 부서 점수 분포</div>
    ${chartBlockHtml(renderRangeTrackSVG(rows.map(r => ({ code: r.code, label: r.rec.dept_name, value: overallScore(r.rec) })).filter(v => v.value !== null), null), `조직편차_${data.dept_name}_종합점수`, "종합점수")}`;

  for (const area of AREA_DEFS) {
    const vals = rows.map(r => ({ code: r.code, label: r.rec.dept_name, value: r.rec.area_scores?.[area.key] })).filter(v => typeof v.value === "number");
    if (vals.length < 2) continue;
    html += chartBlockHtml(renderRangeTrackSVG(vals, null), `조직편차_${data.dept_name}_${area.key}`, area.key);
  }
  container.innerHTML = html;
}

/* =========================================================
   Admin mode: drag & drop org tree editor
   ========================================================= */
function renderAdminNode(code, container) {
  const rec = state.recordsByCode[code];
  const kids = childrenByParent()[code] || [];
  const li = document.createElement("li");

  const row = document.createElement("div");
  row.className = "admin-node";
  row.draggable = true;
  row.dataset.code = code;
  row.innerHTML = `<span class="level-chip">Lv${rec ? rec.dept_level : "?"}</span>
    <span>${escapeHtml(rec ? rec.dept_name : code)}</span>
    <span class="code">${escapeHtml(code)}</span>`;

  row.addEventListener("dragstart", (e) => {
    state.dragCode = code;
    row.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
  });
  row.addEventListener("dragend", () => {
    row.classList.remove("dragging");
    document.querySelectorAll(".drop-target").forEach(n => n.classList.remove("drop-target"));
  });
  row.addEventListener("dragover", (e) => {
    e.preventDefault();
    if (state.dragCode && state.dragCode !== code && !isDescendant(state.dragCode, code)) {
      row.classList.add("drop-target");
    }
  });
  row.addEventListener("dragleave", () => row.classList.remove("drop-target"));
  row.addEventListener("drop", (e) => {
    e.preventDefault();
    row.classList.remove("drop-target");
    reparent(state.dragCode, code);
  });

  li.appendChild(row);

  if (kids.length) {
    const ul = document.createElement("ul");
    for (const k of kids) renderAdminNode(k, ul);
    li.appendChild(ul);
  }
  container.appendChild(li);
}

function reparent(code, newParent) {
  if (!code || code === newParent) return;
  if (newParent !== null && isDescendant(code, newParent)) {
    alert("하위 부서를 상위 부서로 이동할 수 없습니다.");
    return;
  }
  state.orgMap[code] = newParent;
  invalidateRollupCache();
  renderAdminMode();
  document.getElementById("admin-status").textContent = `저장되지 않은 변경사항 있음`;
}

function renderAdminMode() {
  const el = document.getElementById("admin-tree");
  el.innerHTML = "";
  const ul = document.createElement("ul");
  for (const root of rootCodes()) renderAdminNode(root, ul);
  el.appendChild(ul);

  document.getElementById("round-name-input").value = state.round || "";
  document.getElementById("round-badge").textContent = state.round || "-";
}

function setupRootDropzone() {
  const zone = document.getElementById("root-dropzone");
  zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("drop-target"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("drop-target"));
  zone.addEventListener("drop", (e) => {
    e.preventDefault();
    zone.classList.remove("drop-target");
    reparent(state.dragCode, null);
  });
}

/* =========================================================
   Report mode: one flat table of every org unit + leader, for
   copy-pasting into Excel/Word as an internal report.
   ========================================================= */
function fmtYoyPlain(v) {
  if (v === null || v === undefined || v === NO_DATA_MARKER) return "데이터없음";
  return (v >= 0 ? "+" : "") + v.toFixed(1);
}

/** Depth-first list of every org code (so the table reads top-down
 * like the org chart), each paired with its ancestor-name path. */
function buildReportRows() {
  const codes = [];
  const childMap = childrenByParent();
  function visit(code) {
    codes.push(code);
    for (const child of childMap[code] || []) visit(child);
  }
  for (const root of rootCodes()) visit(root);

  let maxDepth = 1;
  const rows = [];
  for (const code of codes) {
    const rec = rollup(code);
    if (!rec) continue;
    const path = breadcrumbPath(code).map(c => state.recordsByCode[c]?.dept_name ?? c);
    maxDepth = Math.max(maxDepth, path.length);
    rows.push({ code, rec, path });
  }
  return { rows, maxDepth };
}

/** Turns the checked column groups into an ordered list of column
 * definitions ({ label, align, get }), so the header row and every
 * body row are built from the exact same source (no index bookkeeping
 * to keep in sync between the two). */
function buildReportColumns(cols, maxDepth) {
  const columns = [];
  if (cols.hierarchy) {
    for (let i = 0; i < maxDepth; i++) {
      columns.push({ label: `레벨${i + 1}`, align: "text", get: (rec, path) => path[i] ?? "" });
    }
  } else {
    columns.push({ label: "부서명", align: "text", get: rec => rec.dept_name });
  }
  if (cols.code) columns.push({ label: "부서코드", align: "text", get: rec => rec.dept_code });
  if (cols.leader) {
    columns.push({ label: "부서장명", align: "text", get: rec => rec.leader_name || "-" });
    columns.push({ label: "부서장ID", align: "text", get: rec => rec.leader_id || "-" });
  }
  if (cols.headcount) {
    columns.push({ label: "대상인원", align: "num", get: rec => rec.target_count });
    columns.push({ label: "응답인원", align: "num", get: rec => rec.response_count });
    columns.push({ label: "응답률", align: "num", get: rec => fmtPct(rec.response_rate) });
  }
  if (cols.area) {
    for (const area of AREA_DEFS) columns.push({ label: area.key, align: "num", get: rec => fmtScore(rec.area_scores?.[area.key]) });
  }
  if (cols.areaYoy) {
    for (const area of AREA_DEFS) columns.push({ label: `${area.key} 전년비`, align: "num", get: rec => fmtYoyPlain(rec.area_yoy?.[area.key]) });
  }
  if (cols.item) {
    for (const item of ALL_ITEM_KEYS) columns.push({ label: item, align: "num", get: rec => fmtScore(rec.item_scores?.[item]) });
  }
  if (cols.question) {
    for (const area of AREA_DEFS) for (const item of area.items) {
      for (let i = 1; i <= item.qCount; i++) {
        const qKey = `${item.key}_${i}`;
        columns.push({ label: qKey, align: "num", get: rec => fmtScore(rec.question_scores?.[qKey]) });
      }
    }
  }
  return columns;
}

function renderReportFilters(availableLevels) {
  document.getElementById("report-level-checks").innerHTML = availableLevels.map(l =>
    `<label class="report-checkbox"><input type="checkbox" data-role="level" data-level="${l}" ${state.report.levels.has(l) ? "checked" : ""}> 레벨${l}</label>`
  ).join("");
  document.getElementById("report-column-checks").innerHTML = REPORT_COLUMN_GROUPS.map(g =>
    `<label class="report-checkbox"><input type="checkbox" data-role="column" data-key="${g.key}" ${state.report.columns[g.key] ? "checked" : ""}> ${escapeHtml(g.label)}</label>`
  ).join("");
}

function renderReportMode() {
  const { rows: allRows, maxDepth } = buildReportRows();
  const availableLevels = [...new Set(allRows.map(r => r.rec.dept_level))].sort((a, b) => a - b);
  if (!state.report.levels) state.report.levels = new Set(availableLevels);
  renderReportFilters(availableLevels);

  const rows = allRows.filter(r => state.report.levels.has(r.rec.dept_level));
  const wrap = document.getElementById("report-table-wrap");
  if (!rows.length) {
    wrap.innerHTML = `<div class="note-box">선택된 레벨에 해당하는 부서가 없습니다. 위에서 레벨을 선택하세요.</div>`;
    return;
  }

  const columns = buildReportColumns(state.report.columns, maxDepth);
  if (!columns.length) {
    wrap.innerHTML = `<div class="note-box">표시할 항목을 하나 이상 선택하세요.</div>`;
    return;
  }
  const hierarchyColCount = state.report.columns.hierarchy ? maxDepth : 1;

  const thead = `<thead><tr>${columns.map(c => `<th class="${c.align === "text" ? "text-col" : ""}">${escapeHtml(c.label)}</th>`).join("")}</tr></thead>`;
  const tbody = `<tbody>${rows.map(({ rec, path }) =>
    `<tr>${columns.map((c, i) => `<td class="${c.align === "text" ? "text-col" : ""} ${i < hierarchyColCount ? "level-cell" : ""}">${escapeHtml(String(c.get(rec, path)))}</td>`).join("")}</tr>`
  ).join("")}</tbody>`;

  wrap.innerHTML = `<table class="report-table" id="report-table">${thead}${tbody}</table>`;
}

function tableToTsv(tableEl) {
  return Array.from(tableEl.rows).map(row =>
    Array.from(row.cells).map(cell => cell.textContent.replace(/\s+/g, " ").trim()).join("\t")
  ).join("\n");
}

async function copyReportTable() {
  const table = document.getElementById("report-table");
  const statusEl = document.getElementById("report-copy-status");
  if (!table) return;
  const html = `<table>${table.innerHTML}</table>`;
  const text = tableToTsv(table);

  const showStatus = (msg) => {
    statusEl.textContent = msg;
    setTimeout(() => { if (statusEl.textContent === msg) statusEl.textContent = ""; }, 4000);
  };

  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([
        new ClipboardItem({
          "text/html": new Blob([html], { type: "text/html" }),
          "text/plain": new Blob([text], { type: "text/plain" }),
        }),
      ]);
      showStatus("복사되었습니다. 엑셀/워드에 Ctrl+V로 붙여넣으세요.");
      return;
    }
  } catch (err) { /* fall through to the legacy selection-based copy below */ }

  try {
    const range = document.createRange();
    range.selectNode(table);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    const ok = document.execCommand("copy");
    sel.removeAllRanges();
    showStatus(ok ? "복사되었습니다. 엑셀/워드에 Ctrl+V로 붙여넣으세요." : "복사에 실패했습니다. 표를 드래그해서 Ctrl+C로 복사해주세요.");
  } catch (err) {
    showStatus("복사에 실패했습니다. 표를 드래그해서 Ctrl+C로 복사해주세요.");
  }
}

/* =========================================================
   File I/O
   ========================================================= */
function downloadJson(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function readJsonFile(file, cb) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      cb(JSON.parse(reader.result));
    } catch (err) {
      alert("JSON 파일을 읽는 중 오류가 발생했습니다: " + err.message);
    }
  };
  reader.readAsText(file, "utf-8");
}

/* =========================================================
   Wiring
   ========================================================= */
function setMode(mode) {
  state.mode = mode;
  document.getElementById("view-mode").hidden = mode !== "view";
  document.getElementById("admin-mode").hidden = mode !== "admin";
  document.getElementById("report-mode").hidden = mode !== "report";
  document.getElementById("btn-mode-view").classList.toggle("active", mode === "view");
  document.getElementById("btn-mode-admin").classList.toggle("active", mode === "admin");
  document.getElementById("btn-mode-report").classList.toggle("active", mode === "report");
  renderCurrentMode();
}

function renderCurrentMode() {
  if (state.mode === "view") renderViewMode();
  else if (state.mode === "admin") renderAdminMode();
  else renderReportMode();
}

document.getElementById("btn-mode-view").addEventListener("click", () => setMode("view"));
document.getElementById("btn-mode-admin").addEventListener("click", () => setMode("admin"));
document.getElementById("btn-mode-report").addEventListener("click", () => setMode("report"));

document.getElementById("btn-copy-report").addEventListener("click", copyReportTable);

document.getElementById("report-filters").addEventListener("change", (e) => {
  const input = e.target.closest("input[type=checkbox]");
  if (!input) return;
  if (input.dataset.role === "column") {
    state.report.columns[input.dataset.key] = input.checked;
  } else if (input.dataset.role === "level") {
    const level = Number(input.dataset.level);
    if (input.checked) state.report.levels.add(level);
    else state.report.levels.delete(level);
  }
  renderReportMode();
});

document.getElementById("report-filters").addEventListener("click", (e) => {
  const link = e.target.closest("a[data-action]");
  if (!link) return;
  e.preventDefault();
  switch (link.dataset.action) {
    case "levels-all": state.report.levels = new Set(buildReportRows().rows.map(r => r.rec.dept_level)); break;
    case "levels-none": state.report.levels = new Set(); break;
    case "columns-all": for (const g of REPORT_COLUMN_GROUPS) state.report.columns[g.key] = true; break;
    case "columns-none": for (const g of REPORT_COLUMN_GROUPS) state.report.columns[g.key] = false; break;
  }
  renderReportMode();
});

document.getElementById("view-tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".tab-btn");
  if (!btn) return;
  state.activeTab = btn.dataset.tab;
  renderTabContent();
});

// Delegated so it works for chart-capture buttons rendered inside any
// tab (they're recreated on every re-render, so a direct listener
// would need constant rewiring).
document.body.addEventListener("click", (e) => {
  const btn = e.target.closest(".btn-capture-chart");
  if (!btn) return;
  const block = btn.closest(".chart-block");
  const svg = block?.querySelector("svg");
  const statusEl = block?.querySelector(".chart-copy-status");
  if (!svg) return;
  copyChartImage(svg, statusEl, `${btn.dataset.chartName || "chart"}.png`);
});

document.getElementById("btn-load-survey").addEventListener("click", () => document.getElementById("file-survey").click());
document.getElementById("file-survey").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  readJsonFile(file, (json) => {
    state.surveyData = Array.isArray(json) ? json : json.records || [];
    indexRecords();
    invalidateRollupCache();
    companyBetasCache = null;
    renderCurrentMode();
  });
  e.target.value = "";
});

document.getElementById("btn-load-orgmap").addEventListener("click", () => document.getElementById("file-orgmap").click());
document.getElementById("file-orgmap").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  readJsonFile(file, (json) => {
    state.orgMap = { ...(json.map || json) };
    state.basedOn = state.round;
    state.round = json.round ? `${json.round}(불러옴)` : state.round;
    invalidateRollupCache();
    renderAdminMode();
    document.getElementById("admin-status").textContent = `"${file.name}" 불러옴 — 변경 후 새 회차로 저장하세요`;
  });
  e.target.value = "";
});

document.getElementById("btn-save-orgmap").addEventListener("click", () => {
  const name = document.getElementById("round-name-input").value.trim();
  if (!name) { alert("새 회차 이름을 입력하세요 (예: 2026Q3)"); return; }
  const payload = { round: name, based_on: state.basedOn || null, map: state.orgMap, saved_at: new Date().toISOString() };
  downloadJson(payload, `org_map_${name}.json`);
  state.round = name;
  document.getElementById("round-badge").textContent = name;
  document.getElementById("admin-status").textContent = `org_map_${name}.json 저장됨`;
});

setupRootDropzone();

/* =========================================================
   Init
   ========================================================= */
indexRecords();
state.selectedCode = rootCodes()[0] || null;
if (state.selectedCode) state.expandedTreeNodes.add(state.selectedCode);
document.getElementById("round-badge").textContent = state.round || "-";
renderViewMode();
</script>
</body>
</html>
